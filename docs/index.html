          <h1>DWDM Indonesia — Solusi Transmisi Optik Berkapasitas Tinggi | PT IDTN (IDTN.co.id)</h1>
          <p>
            <strong>Dense Wavelength Division Multiplexing (DWDM)</strong> adalah teknologi transmisi serat optik tercanggih yang mentransmisikan puluhan panjang gelombang cahaya berkecepatan tinggi secara bersamaan melalui satu helai kabel serat optik tunggal di Indonesia.
          </p>
          <p>
            <strong>PT Infinix Delapan Teknologi Nusantara (IDTN.co.id)</strong> bersama prinsipal teknologi global T8 Systems menghadirkan infrastruktur DWDM berkapasitas hingga 800 Gbps per lambda dan 38.4 Tbps per pasang fiber dengan jangkauan proyek 8.514,22 km dari Sabang sampai Merauke.
          </p>
          <h2>Lini Perangkat Hardware DWDM T8 Volga I</h2>
          <ul>
            <li><strong>DWDM System Volga I Telecom:</strong> Sasis modular 1U, 3U, 6U, 10U untuk backbone transmisi jarak jauh dan metro.</li>
            <li><strong>DWDM System Volga I DCI:</strong> Perangkat modular kompak 1U/2U untuk interkoneksi hyperscale data center.</li>
            <li><strong>DWDM System DCI V2:</strong> Platform transmisi data center generasi baru berkapasitas 6.4 Tbps per 2U dengan enkripsi fisik Layer 1 AES-256.</li>
            <li><strong>OTDR Monitoring System Ramenka:</strong> Pemantauan otomatis serat optik 24 jam nonstop dengan akurasi putus kabel hingga 1 meter.</li>
            <li><strong>NMS Titan & Fractal:</strong> Perangkat lunak manajemen dan pengawasan jaringan terpusat dengan otomasi SDN.</li>
